project:
  type: website
  render:
    - "./*.qmd"
    - "slides/*.qmd"
  output-dir: "docs"
  resources:
    - "include/snd/*.m4a"
    - "include/snd/*.wav"
    - "include/img/*.png"
    - "include/img/*.jpg"
    - "include/img/*.gif"
    - "include/img/*.mov"

website:
  title: "PSY 511.001"
  announcement: 
    content: "Welcome to PSY 511.001 Spring 2026. If you find a broken link or typo, let me know. I'll buy you a coffee." 
    position: below-navbar
    icon: info-circle
    dismissable: true
  sidebar:
    style: "docked"
    search: true
    contents:
      - index.qmd
      - schedule.qmd
      - evaluation.qmd
      - policies.qmd
  repo-url: https://github.com/psu-psychology/psy-511-scan-fdns-2026-spring
  repo-actions: [edit, issue]
  repo-subdir: src
  page-footer:
    left: "Copyright © Rick Gilmore under [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)"
    center: "Built with [Quarto](https://quarto.org/)"
    right: 
      - icon: github
        href: https://github.com/psu-psychology/psy-511-scan-fdns-2026-spring
    background: light
    border: true
  page-navigation: true
  bread-crumbs: false
  
format:
  html:
    theme: default
    css: include/css/styles.css
    toc: true
    toc-depth: 4
    fig-align: center
    fontsize: 1.1em
    number-sections: false
    citations-hover: true
    footnotes-hover: true
    date-modified: last-modified
    date: today
    bibliography: [include/bib/packages.bib, include/bib/psu-repro.bib, include/bib/psy-511.bib]
    csl: include/bib/apa.csl
    html-math-method: mathjax
editor: source
    